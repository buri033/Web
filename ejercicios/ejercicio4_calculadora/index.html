<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - Calculadora Sin Eval</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculadora">
    <div class="banner-no-eval">🚫 ¡SIN usar eval!</div>
    
    <div class="pantalla" id="pantalla">0</div>
    
    <div class="grid-botones">
      <button class="btn operacion" onclick="limpiar()">C</button>
      <button class="btn operacion" onclick="borrar()">⌫</button>
      <button class="btn operacion" onclick="operar('%')">%</button>
      <button class="btn operacion" onclick="operar('/')">÷</button>

      <button class="btn numero" onclick="numero('7')">7</button>
      <button class="btn numero" onclick="numero('8')">8</button>
      <button class="btn numero" onclick="numero('9')">9</button>
      <button class="btn operacion" onclick="operar('*')">×</button>

      <button class="btn numero" onclick="numero('4')">4</button>
      <button class="btn numero" onclick="numero('5')">5</button>
      <button class="btn numero" onclick="numero('6')">6</button>
      <button class="btn operacion" onclick="operar('-')">-</button>

      <button class="btn numero" onclick="numero('1')">1</button>
      <button class="btn numero" onclick="numero('2')">2</button>
      <button class="btn numero" onclick="numero('3')">3</button>
      <button class="btn operacion" onclick="operar('+')">+</button>

      <button class="btn numero cero" onclick="numero('0')">0</button>
      <button class="btn numero" onclick="numero('.')">.</button>
      <button class="btn igual" onclick="calcularIgual()">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
