<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 - Contador con Límite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Ejercicio 3: Contador con Límite</h1>

    <!-- Mensaje de alerta visual cuando llega a 10 -->
    <div id="alerta" class="alerta" style="display: none;">
      ⚠️ <strong>¡Alerta!</strong> El contador ha llegado a 10.
    </div>

    <div class="contador-container">
      <button id="btnRestar">-</button>
      <span id="valorContador">0</span>
      <button id="btnSumar">+</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
